name: Reusable verification

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source ref to verify; empty uses the triggering commit.
        type: string
        default: ''
      release:
        description: Disable dependency caches for release verification.
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: Artifact containing the verified npm archive and package-info.json.
        value: ${{ jobs.package.outputs.artifact-name }}

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  quality:
    name: Lint, tests, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
          cache: ${{ !inputs.release && 'npm' || '' }}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:release
      - run: npm run test:coverage -- --runInBand
      - name: Preserve coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve failed test output
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
          cache: ${{ !inputs.release && 'npm' || '' }}
      - run: npm ci
      - run: npm test -- --runInBand
      - name: Preserve failed test output
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compatibility-${{ matrix.os }}-node${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7

  fixtures:
    name: Compile fixture and plugin combinations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
          cache: ${{ !inputs.release && 'npm' || '' }}
      - run: npm ci
      - run: npm run build
      - run: npm run verify:fixtures
      - name: Preserve fixture diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fixture-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/fixtures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Verify packed consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
          cache: ${{ !inputs.release && 'npm' || '' }}
      - run: npm ci
      - run: npm run build
      - run: npm run package:verify
      - id: metadata
        name: Identify verified archive artifact
        shell: bash
        run: echo "artifact-name=npm-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Preserve verified package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: .release/package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve failed consumer diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-output/
            .artifacts/package/
            !.artifacts/package/**/node_modules/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  live-integration:
    name: Generated client against FastAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
          cache: ${{ !inputs.release && 'npm' || '' }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi uvicorn python-multipart
      - run: npm ci
      - run: npm run build
      - run: npm run verify:live
      - name: Preserve live integration diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: live-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-output/
            .artifacts/live/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Audit all dependency groups
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Audit production and development dependencies
        shell: bash
        run: npm audit --audit-level=moderate --json > dependency-audit.json
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 7

  required-checks:
    name: Required checks
    if: always()
    needs: [quality, compatibility, fixtures, package, live-integration, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'JS'
          const results = JSON.parse(process.env.JOB_RESULTS);
          const failed = Object.entries(results).filter(([, job]) => job.result !== 'success');
          for (const [name, job] of Object.entries(results)) console.log(`${name}: ${job.result}`);
          if (failed.length) process.exitCode = 1;
          JS
