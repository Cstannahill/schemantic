name: CI

on:
  push:
    branches: [main, master, "fix/*"]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Generate test output
        run: |
          # generate into test-output/generated so tests can inspect it
          node dist/cli/index.js generate test-schemas/image-conversion-schema-openapi.json -o test-output/generated --client --types --hooks --plugins zod-validation,jsdoc --quiet

      - name: Run tests
        run: npm test --silent

      - name: Upload generated artifact (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-types
          path: test-output/generated
